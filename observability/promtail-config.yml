server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: prflow-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["prflow.logs=true"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_prflow_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: logstream
    pipeline_stages:
      # Só system logs (JSON com timestamp) — ignora GhLogger, Next.js, notices do Postgres etc.
      # RE2 (Promtail) não suporta lookahead negativo; descarta linhas que não começam com "{".
      - drop:
          expression: '^[^{]'
          drop_counter_reason: not_system_log
      - json:
          expressions:
            level: level
            source: source
            message: message
      - labels:
          level:
          source:
