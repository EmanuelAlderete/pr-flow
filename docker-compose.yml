services:
  app:
    build: .
    ports:
      - "${PORT:-3847}:3847"
    environment:
      PORT: 3847
      HOSTNAME: 0.0.0.0
      LOG_FORMAT: json
      DATABASE_URL: file:/app/data/pr-flow.sqlite
      PR_FLOW_ROOT: /app
      GH_TOKEN: ${GH_TOKEN}
      MONITORED_REPOSITORIES: ${MONITORED_REPOSITORIES}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-}
      SUMMARY_CAREER_LEVEL: ${SUMMARY_CAREER_LEVEL:-}
      SUMMARY_CRON_TZ: ${SUMMARY_CRON_TZ:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      JIRA_SITE_URL: ${JIRA_SITE_URL:-}
      JIRA_SPRINT_PROJECT_KEY: ${JIRA_SPRINT_PROJECT_KEY:-}
      JIRA_SPRINT_BOARD_ID: ${JIRA_SPRINT_BOARD_ID:-}
      DISABLE_JIRA_SYNC_CRON: ${DISABLE_JIRA_SYNC_CRON:-}
      DISABLE_PR_SYNC_CRON: ${DISABLE_PR_SYNC_CRON:-}
      DISABLE_PR_LOCAL_REVIEW_CRON: "1"
      DISABLE_SUMMARY_CRON: ${DISABLE_SUMMARY_CRON:-}
      DISABLE_DASHBOARD_BRIEFING_CRON: ${DISABLE_DASHBOARD_BRIEFING_CRON:-}
      SLACK_BOT_OAUTH_TOKEN: ${SLACK_BOT_OAUTH_TOKEN:-}
      SLACK_PR_CHANNEL: ${SLACK_PR_CHANNEL:-}
      GOOGLE_CALENDAR_ICAL_URL: ${GOOGLE_CALENDAR_ICAL_URL:-}
    volumes:
      - ./data:/app/data
    mem_limit: 768m
